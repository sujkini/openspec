version: 1

filesystem_policy:
  read_only: [/usr, /lib, /etc]
  read_write: [/sandbox, /tmp, /home/sandbox]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:

  # ALLOWED: Red Hat Claude API
  redhat_ai:
    name: redhat-ai
    endpoints:
      - host: claude--apicast-production.apps.int.stc.ai.prod.us-east-1.aws.paas.redhat.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/*"
          - allow:
              method: GET
              path: "/*"
    binaries:
      - path: /usr/bin/node
      - path: /usr/local/bin/node
      - path: /usr/bin/python3
      - path: /usr/local/bin/python3

  # ALLOWED: npm registry for package installs
  npm_registry:
    name: npm-registry
    endpoints:
      - host: registry.npmjs.org
        port: 443
      - host: registry.yarnpkg.com
        port: 443
    binaries:
      - path: /usr/bin/npm
      - path: /usr/local/bin/npm
      - path: /usr/bin/yarn

  # ALLOWED: GitHub for cloning (read-only)
  github:
    name: github
    endpoints:
      - host: github.com
        port: 443
      - host: raw.githubusercontent.com
        port: 443
    binaries:
      - path: /usr/bin/git
