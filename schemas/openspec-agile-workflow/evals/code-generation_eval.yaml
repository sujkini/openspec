      - PAT-015
    input_refs:
      - evals/inputs/bugs/CM-735.md
      - evals/inputs/05-repo-prs.md
    prompt: |
      IstioCSR controller must register on the unified ctrl.Manager from setup_manager.go.
      Must not create a separate Manager or isolated cache for istiocsr reconcilers.
    assertions:
      must_use_pattern:
        - setup_manager.go
        - EnableIstioCSR
      must_not_use:
        - ctrl.NewManager
        - cache.New
      must_follow_constitution: true
      must_pass_make_targets:
        - make test
    scoring:
      method: weighted_checklist
      pass_threshold: 90
