# Maps openspec-agile-workflow artifact IDs → stage eval files (forward /opsx-continue gate)
#
# Generation templates: templates/ (via openspec instructions)
# Eval rubrics: harness-evals/evals/<stage>_eval.yaml
# Do NOT refine templates during forward workflow — refine the change artifact only.

schema_templates_dir: templates/

artifacts:
  validation:
    stage: validation
    generates: validation.json
    schema_template: validation.md
    stage_eval_file: null
    eval_spec: null
    gate: rubric_only
    note: Score against validation.md rubric; no stage *_eval.yaml

  specs:
    stage: specs
    generates: specs.md
    schema_template: spec.md
    stage_eval_file: null
    eval_spec: null
    gate: skip
    note: No stage eval file; user approval only after generation

  repo-assessment:
    stage: repo-assessment
    generates: repo-assessment.md
    schema_template: repo-assessment.md
    stage_eval_file: harness-evals/evals/repo-assessment_eval.yaml
    eval_spec: eval-generation/eval-generation-workflow/stages/repo-assessment-eval-spec.yaml
    gate: stage_evals

  # constitution is no longer a generated artifact — it is an INPUT.
  # See schema constitution_md for lookup order. Template retained at templates/constitution-template.md
  # for reference and fallback generation.

  plan:
    stage: plan
    generates: plan.md
    schema_template: plan.md
    stage_eval_file: harness-evals/evals/plan_eval.yaml
    eval_spec: eval-generation/eval-generation-workflow/stages/plan-eval-spec.yaml
    gate: stage_evals

  tasks:
    stage: tasks
    generates: tasks.md
    schema_template: tasks.md
    stage_eval_file: harness-evals/evals/tasks_eval.yaml
    eval_spec: eval-generation/eval-generation-workflow/stages/tasks-eval-spec.yaml
    gate: stage_evals

eval_results_dir: openspec/changes/<change-name>/eval-results/

# Pre-PR code review gate (runs after implementation, before PR)
# See schema code_review_gate and stage-gate/REVIEW_GATE_PROMPT.md
code_review:
  stage: implementation
  runs_after: all tasks complete (per phase or one-shot)
  runs_before: PR prompt
  review_engine: /oape:review (.cursor/commands/review.md)
  auto_fixer: /oape:implement-review-fixes (.cursor/commands/implement-review-fixes.md)
  gate_prompt: stage-gate/REVIEW_GATE_PROMPT.md
  report_template: templates/review-report-template.md
  report_output: openspec/changes/<change-name>/implementation/review-report.md
  config_key: flags.review_gate
  default: true

# Evaluation reports — REMOVED (eval-results/<artifact-id>.yaml is sufficient)
# The agent uses eval-results YAML for refinement and scoring.
# No separate _evaluation_report.md is generated.
