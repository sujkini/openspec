# implementation/state.yaml — Orchestrator state file
# /opsx-apply MUST read this file FIRST on every invocation.
# /opsx-apply MUST write this file after every state transition.
# DO NOT manually edit unless recovering from a broken state.

machine:
  # ai-helpers mode states: IDLE | EXECUTING_TASK | RUNNING_TESTS | EVAL_GATE | AWAITING_APPROVAL | REVIEW_GATE | REVIEW_RUNNING | REVIEW_FIXING | REVIEW_APPROVAL | COMPLETE
  # direct mode states:     IDLE | EXECUTING_TASK | RUNNING_TESTS | AWAITING_APPROVAL | REVIEW_GATE | REVIEW_RUNNING | REVIEW_FIXING | REVIEW_APPROVAL | COMPLETE
  state: IDLE
  current_task_id: null
  current_task_index: 0
  total_tasks: 0
  last_transition: null  # ISO8601 timestamp

# Completed tasks — lightweight; details in task-reports/<task-id>.md
completed: []
# Example (ai-helpers mode):
#   - task_id: T1_1
#     oape_command: api-generate
#     test_result: PASS
#     eval_score: 100
# Example (direct mode):
#   - task_id: T1_1
#     test_result: PASS

# Current task result — written during execution, cleared on advance
current_task_result: null
# When populated (during AWAITING_APPROVAL):
#
# --- ai-helpers mode fields ---
#   task_id: T3_1
#   oape_command: api-implement
#   files_changed: [pkg/controller/foo/controller.go]
#   verification_pass: true
#   test_command: "go test ./pkg/controller/foo/... -v -count=1"
#   test_result: PASS
#   test_output_summary: "ok  github.com/org/repo/pkg/controller/foo 0.022s"
#   eval_score: 95
#   eval_cases_pass: 2
#   eval_cases_total: 2
#   refinement_rounds: 1
#
# --- direct mode fields ---
#   task_id: T3_1
#   files_changed: [pkg/controller/foo/controller.go]
#   verification_pass: true
#   test_command: "go test ./pkg/controller/foo/... -v -count=1"
#   test_result: PASS
#   test_output_summary: "ok  github.com/org/repo/pkg/controller/foo 0.022s"

# Rejection history for current task (cleared on advance)
rejections: []
# Example:
#   - round: 1
#     feedback: "Missing error handling for nil pointer"

# Pre-PR code review gate state (see schema code_review_gate)
# Updated by /opsx-apply step 6a and /opsx-review
review:
  # Status: not_started | running | fixing | approval | passed | failed
  status: not_started
  report_path: ""           # Path to implementation/review-report.md
  fix_rounds: 0             # Number of auto-fix iterations completed
  issues_total: 0           # Total issues found by /oape:review
  issues_fixed: 0           # Issues auto-fixed by /oape:implement-review-fixes
  issues_remaining: 0       # Unresolved issues after auto-fix
  verdict: ""               # Approved | Changes Requested
  last_reviewed_at: ""      # ISO8601 timestamp
  review_base_ref: ""       # Base ref used for diff (e.g. origin/main)
  blocked_by_critical: false # True if CRITICAL issues remain and review_block_on_critical is true
  review_feedback_rounds: 0 # User rejection + re-review rounds (max 2)
